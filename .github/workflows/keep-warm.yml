# Keep the Render free-tier backend awake so visitors don't hit a 30-60s
# cold start. Pings the cheap /api/health endpoint every ~10 min (Render
# spins down after 15 min idle). Free: runs on GitHub Actions minutes.
#
# Caveat: scheduled workflows can be delayed by GitHub during peak load, so
# this keeps the backend warm MOST of the time, not guaranteed always.
# GitHub also disables schedules after 60 days of repo inactivity.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a ping manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping backend health
        run: |
          code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" \
            https://fermata-api.onrender.com/api/health)
          echo "health -> $code"
          [ "$code" = "200" ]
