# Keep the Hugging Face Space backend awake. HF free Spaces sleep after ~48h
# idle; pinging /api/health every ~10 min keeps it active so visitors don't
# hit a cold start. Free: runs on GitHub Actions minutes.
#
# Caveat: scheduled workflows can be delayed by GitHub during peak load.
# GitHub also disables schedules after 60 days of repo inactivity.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a ping manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping backend health
        run: |
          code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" \
            https://arjunsh6251-fermata.hf.space/api/health)
          echo "health -> $code"
          [ "$code" = "200" ]
